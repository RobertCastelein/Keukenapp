<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3b2d">
  <title>Keuken</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <div id="tijd" class="tijd">--:--</div>
      <div id="datum" class="datum"></div>
    </div>
    <div class="knoppen">
      <button id="volledig" class="knop" type="button">Schermvullend</button>
      <span id="wakker" class="status" hidden>Scherm blijft aan</span>
    </div>
  </header>

  <main class="raster">
    <section class="kaart agenda">
      <div class="kop">
        <h2>Agenda</h2>
        <button id="agendaInstellen" class="knop klein" type="button" aria-label="Agenda instellen">Instellen</button>
      </div>
      <div id="agendaLijst">
        <p class="leeg">Nog geen agenda gekoppeld. Tik op Instellen.</p>
      </div>
    </section>

    <section class="kaart recepten">
      <div class="kop">
        <h2>Recepten</h2>
      </div>
      <form id="receptForm" class="plakrij">
        <input id="receptLink" type="url" placeholder="Plak hier een link naar een recept" autocomplete="off" required>
        <button class="knop hoofd" type="submit">Toevoegen</button>
      </form>
      <p id="receptMelding" class="melding" hidden></p>
      <div id="receptLijst" class="receptlijst"></div>
    </section>
  </main>

  <dialog id="agendaDialoog" class="dialoog">
    <form method="dialog">
      <h3>Koppeling met Google</h3>
      <p>Plak hier de web-app-link van je Google-script. Die wordt gebruikt voor de agenda én de recepten.</p>
      <input id="agendaUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
      <div class="knoppen">
        <button value="annuleer" class="knop" type="submit">Annuleren</button>
        <button value="opslaan" class="knop hoofd" type="submit">Opslaan</button>
      </div>
    </form>
  </dialog>

  <dialog id="receptDialoog" class="dialoog groot">
    <div class="recept">
      <div class="receptkop">
        <button id="receptSluit" class="knop" type="button">Sluiten</button>
      </div>
      <img id="rAfbeelding" class="receptbeeld" alt="" hidden>
      <h3 id="rTitel"></h3>
      <p id="rInfo" class="receptinfo"></p>
      <div class="receptinhoud">
        <section id="rIngredientenBlok">
          <h4>Ingrediënten</h4>
          <ul id="rIngredienten" class="ingredienten"></ul>
        </section>
        <section id="rStappenBlok">
          <h4>Bereiding</h4>
          <ol id="rStappen" class="stappen"></ol>
        </section>
      </div>
      <p id="rTekst" class="recepttekst" hidden></p>
      <div class="receptvoet">
        <a id="rBron" target="_blank" rel="noopener">Bekijk origineel</a>
        <button id="rVerwijder" class="knop" type="button">Verwijderen</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
