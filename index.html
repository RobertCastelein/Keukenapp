<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3b2d">
  <title>Keuken</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <div id="tijd" class="tijd">--:--</div>
      <div id="datum" class="datum"></div>
    </div>
    <div class="knoppen">
      <button id="volledig" class="knop" type="button">Schermvullend</button>
      <span id="wakker" class="status" hidden>Scherm blijft aan</span>
    </div>
  </header>

  <main class="raster">
    <section class="kaart agenda">
      <div class="kop">
        <h2>Agenda</h2>
        <button id="agendaInstellen" class="knop klein" type="button" aria-label="Agenda instellen">Instellen</button>
      </div>
      <div id="agendaLijst">
        <p class="leeg">Nog geen agenda gekoppeld. Tik op Instellen.</p>
      </div>
    </section>

    <section class="kaart recepten">
      <h2>Recepten</h2>
      <p class="leeg">Hier komen jullie recepten. Link plakken en opslaan volgt in stap 3.</p>
    </section>
  </main>

  <dialog id="agendaDialoog" class="dialoog">
    <form method="dialog">
      <h3>Agenda koppelen</h3>
      <p>Plak hier de web-app-link van je Google-script.</p>
      <input id="agendaUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
      <div class="knoppen">
        <button value="annuleer" class="knop" type="submit">Annuleren</button>
        <button value="opslaan" class="knop hoofd" type="submit">Opslaan</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
